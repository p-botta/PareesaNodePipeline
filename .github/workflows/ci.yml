name: CI - Test, Build and Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '18'
  IMAGE_NAME: ci-cd-demo
  PORT: 8080

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint, Test and Integration Check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Integration check against local server
        run: |
          node src/index.js > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -fsS "http://localhost:${PORT}/health"; then
              echo
              echo "Local server healthy on port ${PORT}"
              kill "$SERVER_PID"
              exit 0
            fi
            sleep 1
          done
          echo "Local server never became healthy"
          cat server.log
          kill "$SERVER_PID" || true
          exit 1

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Export image
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  smoke-test:
    runs-on: ubuntu-latest
    name: Smoke Test Container
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Start container
        run: |
          docker run -d --name app \
            -e NODE_ENV=production \
            -e PORT \
            -p 3000:3000 \
            "${IMAGE_NAME}:${GITHUB_SHA}"
      
      - name: debug
        run: |
          echo "=== DEBUG: Listing all listening ports ==="netstat -tlnp || ss -tlnu || lsof -i -P -n | grep LISTEN

      - name: Check health endpoint
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              echo
              echo "Smoke test passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 2s..."
            sleep 2
          done
          echo "Smoke test failed after 15 attempts"
          docker ps -a
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f app || true
